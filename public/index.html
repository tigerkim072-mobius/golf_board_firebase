<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스크린 골프 실시간 스코어보드</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    .btn-step {
      width: 2rem;
      height: 2rem;
      background-color: #f1f5f9;
      color: #1e293b;
      font-weight: 800;
      font-size: 1.1rem;
      border-radius: 0.5rem;
      border: 1px solid #cbd5e1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      user-select: none;
    }
    .btn-step:hover { background-color: #e2e8f0; }
    .btn-step:active { transform: scale(0.92); }

    .btn-step-sm {
      width: 1.5rem;
      height: 1.5rem;
      background-color: #f8fafc;
      color: #334155;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 0.375rem;
      border: 1px solid #cbd5e1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      user-select: none;
    }
    .btn-step-sm:hover { background-color: #e2e8f0; }
    .btn-step-sm:active { transform: scale(0.9); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const KEY_USERS = 'golf_users_data';
    const KEY_GAME = 'golf_current_game_simple';

    // 기본 골퍼 명단
    const defaultUsers = [
      { id: 'u1', name: '김골프', defaultHandy: 10 },
      { id: 'u2', name: '이싱글', defaultHandy: 4 },
      { id: 'u3', name: '박이글', defaultHandy: 18 },
      { id: 'u4', name: '최버디', defaultHandy: 8 }
    ];

    // 기본 현재 게임
    const defaultGame = {
      gameId: 'game_001',
      date: '2026-10-19',
      scores: [
        { userId: 'u1', handicap: 10, totalScore: 84, mulligans: 1 },
        { userId: 'u2', handicap: 4, totalScore: 75, mulligans: 0 },
        { userId: 'u3', handicap: 18, totalScore: 91, mulligans: 2 },
        { userId: 'u4', handicap: 8, totalScore: 80, mulligans: 1 }
      ]
    };

    function App() {
      const [activeTab, setActiveTab] = useState('scoreboard'); // 'scoreboard' | 'users'
      const [rankBy, setRankBy] = useState('net'); // 'net' | 'gross'

      // 새 골퍼 등록 입력값
      const [newUserName, setNewUserName] = useState('');
      const [newUserHandy, setNewUserHandy] = useState(0);

      // 골퍼 편집 모드 상태 관리 (ID, 수정 중인 이름, 수정 중인 핸디)
      const [editingUserId, setEditingUserId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editHandy, setEditHandy] = useState(0);

      // 사용자 목록 (LocalStorage)
      const [users, setUsers] = useState(() => {
        try {
          const saved = localStorage.getItem(KEY_USERS);
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return defaultUsers;
      });

      // 현재 라운드 스코어 (LocalStorage)
      const [game, setGame] = useState(() => {
        try {
          const saved = localStorage.getItem(KEY_GAME);
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return defaultGame;
      });

      useEffect(() => {
        localStorage.setItem(KEY_USERS, JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem(KEY_GAME, JSON.stringify(game));
      }, [game]);

      // 사용자 정보와 스코어 조인 & 순위 계산
      const displayScoreboard = useMemo(() => {
        const combined = game.scores.map(s => {
          const matchedUser = users.find(u => u.id === s.userId);
          const userName = matchedUser ? matchedUser.name : '(미등록)';
          const gross = Number(s.totalScore) || 0;
          const handy = Number(s.handicap) || 0;
          const net = gross - handy;

          return {
            ...s,
            name: userName,
            grossScore: gross,
            netScore: net
          };
        });

        combined.sort((a, b) => {
          const primary = rankBy === 'net' ? a.netScore - b.netScore : a.grossScore - b.grossScore;
          if (primary !== 0) return primary;
          return a.grossScore - b.grossScore;
        });

        return combined.map((item, idx, arr) => {
          const key = rankBy === 'net' ? 'netScore' : 'grossScore';
          let rank = idx + 1;
          if (idx > 0 && item[key] === arr[idx - 1][key]) {
            rank = arr[idx - 1].rank;
          }
          return { ...item, rank };
        });
      }, [users, game, rankBy]);

      // -----------------------------------------------------------
      // [골퍼 관리] 핸디캡 변경 로직
      // -----------------------------------------------------------
      // 1. 골퍼 목록에서 +/- 버튼으로 핸디캡 즉시 조절
      const adjustUserHandy = (userId, delta) => {
        setUsers(prev => prev.map(u => {
          if (u.id !== userId) return u;
          const updatedHandy = Math.max(0, (Number(u.defaultHandy) || 0) + delta);
          return { ...u, defaultHandy: updatedHandy };
        }));

        // 현재 진행 중인 게임에도 변경된 핸디캡을 동기화
        setGame(prev => ({
          ...prev,
          scores: prev.scores.map(s => {
            if (s.userId !== userId) return s;
            const updatedHandy = Math.max(0, (Number(s.handicap) || 0) + delta);
            return { ...s, handicap: updatedHandy };
          })
        }));
      };

      // 2. 인라인 편집 모드 시작
      const startEditingUser = (user) => {
        setEditingUserId(user.id);
        setEditName(user.name);
        setEditHandy(user.defaultHandy);
      };

      // 3. 인라인 편집 저장
      const saveUserEdit = (userId) => {
        if (!editName.trim()) {
          alert('이름을 입력해주세요.');
          return;
        }

        const handyVal = Math.max(0, parseInt(editHandy, 10) || 0);

        setUsers(prev => prev.map(u => {
          if (u.id !== userId) return u;
          return { ...u, name: editName.trim(), defaultHandy: handyVal };
        }));

        // 현재 게임 스코어보드의 핸디캡도 함께 업데이트
        setGame(prev => ({
          ...prev,
          scores: prev.scores.map(s => {
            if (s.userId !== userId) return s;
            return { ...s, handicap: handyVal };
          })
        }));

        setEditingUserId(null);
      };

      // -----------------------------------------------------------
      // [스코어보드] 실시간 타수/핸디/멀리건 조절
      // -----------------------------------------------------------
      const adjustScore = (userId, field, delta) => {
        setGame(prev => ({
          ...prev,
          scores: prev.scores.map(s => {
            if (s.userId !== userId) return s;
            const currentVal = Number(s[field]) || 0;
            return { ...s, [field]: Math.max(0, currentVal + delta) };
          })
        }));
      };

      const handleDirectInput = (userId, field, val) => {
        const num = Math.max(0, parseInt(val, 10) || 0);
        setGame(prev => ({
          ...prev,
          scores: prev.scores.map(s => s.userId === userId ? { ...s, [field]: num } : s)
        }));
      };

      const handleResetScoresOnly = () => {
        if (!confirm('현재 게임의 타수와 멀리건을 모두 0으로 초기화하시겠습니까?')) return;
        setGame(prev => ({
          ...prev,
          scores: prev.scores.map(s => ({
            ...s,
            totalScore: 0,
            mulligans: 0
          }))
        }));
      };

      const handleRemoveFromGame = (userId) => {
        setGame(prev => ({
          ...prev,
          scores: prev.scores.filter(s => s.userId !== userId)
        }));
      };

      const handleAddPlayerToGame = (user) => {
        const alreadyInGame = game.scores.some(s => s.userId === user.id);
        if (alreadyInGame) {
          alert('이미 게임에 참가 중인 골퍼입니다.');
          return;
        }
        setGame(prev => ({
          ...prev,
          scores: [
            ...prev.scores,
            { userId: user.id, handicap: user.defaultHandy, totalScore: 0, mulligans: 0 }
          ]
        }));
      };

      const handleRegisterUser = (e) => {
        e.preventDefault();
        if (!newUserName.trim()) return;

        const newUser = {
          id: 'u_' + Date.now(),
          name: newUserName.trim(),
          defaultHandy: Math.max(0, Number(newUserHandy) || 0)
        };

        setUsers(prev => [...prev, newUser]);
        setNewUserName('');
        setNewUserHandy(0);
      };

      const handleDeleteUser = (userId) => {
        if (!confirm('이 골퍼를 등록 명단에서 삭제하시겠습니까?')) return;
        setUsers(prev => prev.filter(u => u.id !== userId));
      };

      const getRankBadgeClass = (rank) => {
        if (rank === 1) return 'bg-amber-400 text-amber-950 ring-2 ring-amber-300';
        if (rank === 2) return 'bg-slate-300 text-slate-800';
        if (rank === 3) return 'bg-amber-700 text-amber-50';
        return 'bg-slate-100 text-slate-600';
      };

        return (
        <div className="max-w-4xl mx-auto space-y-6">


          {/* 상단 네비게이션 헤더 */}
          <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-2xl">⛳</span>
                <h1 className="text-2xl font-black text-slate-900">스크린 골프 스코어보드</h1>
              </div>
              <p className="text-xs text-slate-500 mt-1">골퍼 프로필 및 핸디캡을 실시간으로 관리하고 저장합니다.</p>
            </div>

            <div className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
              <button
                onClick={() => setActiveTab('scoreboard')}
                className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                  activeTab === 'scoreboard' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                📊 스코어보드
              </button>
              <button
                onClick={() => setActiveTab('users')}
                className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                  activeTab === 'users' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                👥 골퍼 핸디 관리 ({users.length}명)
              </button>
            </div>
          </header>

          {/* 1. 스코어보드 탭 */}
          {activeTab === 'scoreboard' && (
            <div className="space-y-4">
              <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <select
                    value={rankBy}
                    onChange={(e) => setRankBy(e.target.value)}
                    className="text-xs bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 font-bold outline-none"
                  >
                    <option value="net">정렬 : 네트 (타수 - 핸디)</option>
                    <option value="gross">정렬 : 그로스 (총 타수만)</option>
                    <option value="room">정렬 : 게임방 </option>
                  </select>
                </div>

                <div>
                  <button
                    onClick={handleResetScoresOnly}
                    className="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 text-xs font-bold px-3 py-2 rounded-lg transition-colors"
                  >
                    타수 0 초기화
                  </button>
                </div>
              </div>

              <main className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse min-w-[620px]">
                    <thead>
                      <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs font-bold uppercase">
                        <th className="py-3.5 px-4 text-center w-16">순위</th>
                        <th className="py-3.5 px-4 text-center w-28 bg-emerald-50 text-emerald-900">최종점수</th>
                        <th className="py-3.5 px-4 w-36">골퍼 이름</th>
                        <th className="py-3.5 px-4 text-center w-36">타수</th>
                        <th className="py-3.5 px-4 text-center w-28">핸디</th>
                        <th className="py-3.5 px-4 text-center w-32">멀리건</th>
                        <th className="py-3.5 px-4 text-center w-16">제외</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-sm">
                      {displayScoreboard.length === 0 ? (
                        <tr>
                          <td colSpan="7" className="text-center py-10 text-slate-400 font-medium">
                            참가 중인 골퍼가 없습니다.<br />
                            상단의 <b>[골퍼 핸디 관리]</b> 탭에서 골퍼를 게임에 참가시켜 주세요.
                          </td>
                        </tr>
                      ) : (
                        displayScoreboard.map(item => (
                          <tr key={item.userId} className="hover:bg-slate-50/80 transition-colors">
                            <td className="py-4 px-4 text-center">
                              <span className={`inline-flex w-7 h-7 rounded-full items-center justify-center font-bold text-xs ${getRankBadgeClass(item.rank)}`}>
                                {item.rank}
                              </span>
                            </td>
                            <td className="py-4 px-4 text-center font-black text-emerald-600 bg-emerald-50 text-xl">
                              {item.netScore}
                            </td>
                            <td className="py-4 px-4 font-bold text-slate-900 text-base">
                              <div>
                              {item.name}
                              </div>
                            </td>
                            <td className="py-4 px-4 text-center">
                              <div className="inline-flex items-center gap-2">
                                <button
                                  onClick={() => adjustScore(item.userId, 'totalScore', -1)}
                                  className="btn-step hover:border-slate-400 active:bg-slate-300"
                                >
                                  -
                                </button>
                                <input
                                  type="number"
                                  value={item.totalScore}
                                  onChange={(e) => handleDirectInput(item.userId, 'totalScore', e.target.value)}
                                  className="w-14 text-center font-black text-xl text-slate-900 border border-slate-300 rounded-lg py-1 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                />
                                <button
                                  onClick={() => adjustScore(item.userId, 'totalScore', 1)}
                                  className="btn-step hover:border-slate-400 active:bg-slate-300"
                                >
                                  +
                                </button>
                              </div>
                            </td>
                            <td className="py-4 px-4 text-center">
                              <div className="inline-flex items-center gap-1.5">
                                <button onClick={() => adjustScore(item.userId, 'handicap', -1)} className="btn-step-sm">-</button>
                                <span className="w-6 text-center font-semibold text-slate-700">{item.handicap}</span>
                                <button onClick={() => adjustScore(item.userId, 'handicap', 1)} className="btn-step-sm">+</button>
                              </div>
                            </td>

                            <td className="py-4 px-4 text-center">
                              <div className="inline-flex items-center gap-1.5">
                                <button onClick={() => adjustScore(item.userId, 'mulligans', -1)} className="btn-step-sm">-</button>
                                <span className="w-5 text-center font-bold text-amber-600">{item.mulligans}</span>
                                <button onClick={() => adjustScore(item.userId, 'mulligans', 1)} className="btn-step-sm">+</button>
                              </div>
                            </td>
                            <td className="py-4 px-4 text-center">
                              <button
                                onClick={() => handleRemoveFromGame(item.userId)}
                                className="text-xs text-slate-400 hover:text-rose-500 font-semibold"
                              >
                                제외
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </main>
            </div>
          )}

          {/* 2. 골퍼 및 핸디 관리 탭 */}
          {activeTab === 'users' && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

              {/* 좌측: 골퍼 신규 등록 폼 */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4 h-fit">
                <h2 className="text-base font-bold text-slate-900 border-b pb-2">➕ 새 골퍼 등록</h2>
                <form onSubmit={handleRegisterUser} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-600 block mb-1">골퍼 이름 / 닉네임</label>
                    <input
                      type="text"
                      placeholder="예: 홍길동"
                      value={newUserName}
                      onChange={(e) => setNewUserName(e.target.value)}
                      className="w-full text-sm border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500"
                      required
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600 block mb-1">기본 핸디캡</label>
                    <input
                      type="number"
                      value={newUserHandy}
                      onChange={(e) => setNewUserHandy(e.target.value)}
                      className="w-full text-sm border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-2.5 rounded-lg transition-colors shadow-sm"
                  >
                    골퍼 등록
                  </button>
                </form>
              </div>

              {/* 우측: 등록된 골퍼 명단 및 핸디캡 수정 영역 */}
              <div className="md:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h2 className="text-base font-bold text-slate-900">골퍼 명단 및 핸디캡 설정 ({users.length}명)</h2>
                  <span className="text-xs text-slate-400">핸디캡 +/- 조절 시 저장소에 자동 보관됩니다.</span>
                </div>

                <div className="space-y-2.5">
                  {users.map(u => {
                    const isParticipating = game.scores.some(s => s.userId === u.id);
                    const isEditing = editingUserId === u.id;

                    return (
                      <div
                        key={u.id}
                        className={`p-3.5 rounded-xl border transition-all ${
                          isEditing ? 'border-emerald-400 bg-emerald-50/20 ring-1 ring-emerald-300' : 'border-slate-200 bg-slate-50'
                        }`}
                      >
                        {isEditing ? (
                          /* 수정 모드 */
                          <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2 flex-1">
                              <input
                                type="text"
                                value={editName}
                                onChange={(e) => setEditName(e.target.value)}
                                className="text-sm font-bold border border-slate-300 rounded-lg px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-emerald-500 w-36"
                              />
                              <div className="flex items-center gap-1.5">
                                <span className="text-xs text-slate-500 font-bold">핸디:</span>
                                <input
                                  type="number"
                                  value={editHandy}
                                  onChange={(e) => setEditHandy(e.target.value)}
                                  className="text-sm font-bold border border-slate-300 rounded-lg px-2 py-1.5 w-16 text-center outline-none focus:ring-2 focus:ring-emerald-500"
                                />
                              </div>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <button
                                onClick={() => saveUserEdit(u.id)}
                                className="text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg transition-colors"
                              >
                                저장
                              </button>
                              <button
                                onClick={() => setEditingUserId(null)}
                                className="text-xs font-bold text-slate-500 hover:text-slate-700 bg-slate-200 px-3 py-1.5 rounded-lg transition-colors"
                              >
                                취소
                              </button>
                            </div>
                          </div>
                        ) : (
                          /* 일반 조회 모드 */
                          <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                              <span className="font-bold text-slate-900 text-sm">{u.name}</span>

                              {/* 핸디캡 실시간 조정기 */}
                              <div className="inline-flex items-center gap-1.5 bg-white border border-slate-200 px-2 py-1 rounded-lg shadow-xs">
                                <span className="text-xs text-slate-400 font-semibold">핸디</span>
                                <button
                                  onClick={() => adjustUserHandy(u.id, -1)}
                                  className="btn-step-sm"
                                  title="핸디 1 감소"
                                >
                                  -
                                </button>
                                <span className="w-7 text-center font-bold text-slate-800 text-sm">{u.defaultHandy}</span>
                                <button
                                  onClick={() => adjustUserHandy(u.id, 1)}
                                  className="btn-step-sm"
                                  title="핸디 1 증가"
                                >
                                  +
                                </button>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              {isParticipating ? (
                                <span className="text-xs font-bold text-emerald-700 bg-emerald-100 border border-emerald-200 px-2.5 py-1 rounded-lg">
                                  참가 중
                                </span>
                              ) : (
                                <button
                                  onClick={() => handleAddPlayerToGame(u)}
                                  className="text-xs font-bold text-white bg-slate-800 hover:bg-slate-900 px-3 py-1.5 rounded-lg transition-colors"
                                >
                                  + 게임 참가
                                </button>
                              )}
                              <button
                                onClick={() => startEditingUser(u)}
                                className="text-xs font-medium text-slate-600 hover:text-indigo-600 border border-slate-200 bg-white hover:bg-slate-50 px-2 py-1 rounded-lg transition-colors"
                              >
                                수정
                              </button>
                              <button
                                onClick={() => handleDeleteUser(u.id)}
                                className="text-xs font-medium text-rose-500 hover:text-rose-700 px-2 py-1"
                              >
                                삭제
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
